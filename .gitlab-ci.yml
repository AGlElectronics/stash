# Stash CI/CD
# Custom pipeline: lint → test → build (validate). Images push only from release tags.
#
# Releases:
# - One tag, both images. A tag matching /^v\d+\.\d+\.\d+$/ (e.g. v0.4.2) on any
#   commit triggers a publish pipeline that rebuilds backend AND frontend at that
#   commit and pushes :<semver> + :latest for both. Backend bakes the semver into
#   app.Version via -ldflags, so /api/health (and the SPA "System" card) shows
#   the actual version instead of "latest". Build is fast and the two images
#   never drift, which is why we no longer split the tag per component.
# - To cut a release: `git tag v0.4.2 && git push origin v0.4.2`. No CI manual
#   step required.
# - STASH_OIDC_AUTHORITY / STASH_OIDC_CLIENT_ID required when building
#   frontend:image (OIDC SPA bakes them in at build time).
#
# Backend images use official golang:*-alpine (Go is pre-installed; no toolchain download).
# sqlc is fetched as a release binary (cached under .ci-tools) — avoid `go install sqlc`,
# which recompiles sqlc every job and is much slower.
#
# Backend:lint uses golangci/golangci-lint (Go + linter pre-installed). Frontend jobs use
# Node only. If *both* sides fail with image pull errors, check runner registry mirrors.
#
# CI cache and MinIO:
# - The `cache:` blocks below only list paths/keys. The runner decides where archives are
#   stored (often S3-compatible storage). If logs show uploads to http://minio:9000/... and
#   "NoSuchBucket", that is the *runner's* cache backend (Helm values / config.toml), not
#   this application. Create the bucket there or switch the runner to GitLab server cache.
# - We use cache `policy: pull` so jobs do not *push* archives to that backend. Push fails
#   loudly (FATAL) when the bucket is missing; pull is a no-op warning when cache is absent.
#   After the runner cache is configured correctly, switch to `pull-push` to populate cache.
# - `S3_ENDPOINT: http://minio:9000` on backend:integration is a *job service* for testing
#   Stash's file features — unrelated to runner cache.

stages:
  - lint
  - test
  - build
  - publish

variables:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  # Pinned; sqlc.yaml is v2 schema — keep in sync with local `sqlc version` when upgrading.
  SQLC_VERSION: "v1.30.0"
  # Required for tag pipelines that build frontend:image (OIDC baked into the SPA).
  STASH_OIDC_SCOPE: "openid profile email"

# sqlc output lives in internal/repository/sqlcgen/ and is gitignored — must exist before
# lint, test, or build (fresh CI clones have no generated Go there).
.backend_sqlc_before:
  before_script:
    # gcc + musl-dev: required for `go test -race` (race detector needs cgo on Alpine).
    - apk add --no-cache git ca-certificates tar wget gcc musl-dev
    # Prebuilt sqlc (cached in .ci-tools) — faster than `go install` on every pipeline.
    - |
      set -e
      SQLC_DIR="${CI_PROJECT_DIR}/.ci-tools"
      mkdir -p "${SQLC_DIR}"
      export PATH="${SQLC_DIR}:${PATH}"
      if [ ! -x "${SQLC_DIR}/sqlc" ]; then
        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64) SQLC_ARCH=amd64 ;;
          aarch64) SQLC_ARCH=arm64 ;;
          *) echo "unsupported uname -m: ${ARCH}"; exit 1 ;;
        esac
        VER="${SQLC_VERSION#v}"
        URL="https://github.com/sqlc-dev/sqlc/releases/download/${SQLC_VERSION}/sqlc_${VER}_linux_${SQLC_ARCH}.tar.gz"
        echo "Downloading sqlc from ${URL}"
        wget -qO- "${URL}" | tar -xz -C "${SQLC_DIR}" sqlc
        chmod +x "${SQLC_DIR}/sqlc"
      fi
      sqlc version
    - cd backend
    - go mod download
    - sqlc generate

.go_setup: &go_setup
  extends: .backend_sqlc_before
  image: golang:1.25-alpine
  variables:
    CGO_ENABLED: "0"
    GOFLAGS: "-buildvcs=false"
    GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  cache:
    key:
      files:
        - backend/go.sum
      prefix: go-${SQLC_VERSION}
    paths:
      - .go/pkg/mod
      - .go/cache
      - .ci-tools
    policy: pull

.node_setup: &node_setup
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
        - frontend/package.json
    paths:
      - frontend/node_modules
    policy: pull
  before_script:
    - cd frontend
    - npm install --no-audit --no-fund

backend:lint:
  extends: .backend_sqlc_before
  stage: lint
  # Must be built with Go >= module version in backend/go.mod (v1.62 ships Go 1.23 and fails).
  image: golangci/golangci-lint:v2.11-alpine
  variables:
    GOFLAGS: "-buildvcs=false"
    GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  cache:
    key:
      files:
        - backend/go.sum
      prefix: go-${SQLC_VERSION}
    paths:
      - .go/pkg/mod
      - .go/cache
      - .ci-tools
    policy: pull
  script:
    - golangci-lint run ./...

frontend:lint:
  <<: *node_setup
  stage: lint
  script:
    - npm run lint
    - npm run typecheck

backend:unit:
  <<: *go_setup
  stage: test
  variables:
    CGO_ENABLED: "1"
  script:
    - go test -race -count=1 ./...

backend:integration:
  <<: *go_setup
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: stash
        POSTGRES_PASSWORD: stash
        POSTGRES_DB: stash_test
  variables:
    CGO_ENABLED: "1"
    DATABASE_URL: "postgres://stash:stash@postgres:5432/stash_test?sslmode=disable"
    APP_ENV: test
    AUTH_MODE: dev
    S3_ENDPOINT: "http://minio:9000"
    S3_BUCKET: stash-test
    S3_ACCESS_KEY_ID: stash
    S3_SECRET_ACCESS_KEY: stashstash
    S3_REGION: us-east-1
    S3_USE_PATH_STYLE: "true"
    POSTGRES_USER: stash
    POSTGRES_PASSWORD: stash
    POSTGRES_DB: stash_test
    GOFLAGS: "-buildvcs=false"
    GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  script:
    - go test -race -count=1 -tags=integration ./...

frontend:unit:
  <<: *node_setup
  stage: test
  script:
    - npm test

backend:build:
  <<: *go_setup
  stage: build
  script:
    - mkdir -p ../artifacts
    - go build -trimpath -ldflags "-s -w -X github.com/AGlElectronics/stash/backend/internal/app.Version=$CI_COMMIT_SHORT_SHA" -o ../artifacts/stash-server ./cmd/server
  artifacts:
    paths:
      - artifacts/stash-server
    expire_in: 1 week

frontend:build:
  <<: *node_setup
  stage: build
  variables:
    STASH_API_BASE_URL: ""
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week

# Registry images: Alpine + git for diff + crane to extract Kaniko from the official image
# (executor image alone does not ship git). GIT_DEPTH=0 so describe/range works reliably.
.publish_base: &publish_base
  stage: publish
  image: alpine:3.21
  variables:
    GIT_DEPTH: "0"
    DOCKER_CONFIG: /kaniko/.docker
    CRANE_VER: "v0.20.2"
    KANIKO_EXECUTOR_IMAGE: "gcr.io/kaniko-project/executor:v1.23.2-debug"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

.publish_before_script: &publish_before_script
  - apk add --no-cache git curl ca-certificates tar
  - |
    set -e
    ARCH="$(uname -m)"
    case "${ARCH}" in
      x86_64) CRANE_ARCH=x86_64 ;;
      aarch64) CRANE_ARCH=arm64 ;;
      *) echo "unsupported uname -m: ${ARCH}"; exit 1 ;;
    esac
    curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VER}/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz" | tar -xz crane
    chmod +x crane && mv crane /usr/local/bin/
    mkdir -p /kaniko /tmp/kexp
    crane export "${KANIKO_EXECUTOR_IMAGE}" - | tar -x -C /tmp/kexp
    EXE="$(find /tmp/kexp -path '*/kaniko/executor' -type f | head -1)"
    if [ -z "${EXE}" ]; then echo "kaniko executor not found inside ${KANIKO_EXECUTOR_IMAGE}"; exit 1; fi
    cp "${EXE}" /kaniko/executor
    chmod +x /kaniko/executor
  - mkdir -p /kaniko/.docker
  - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

backend:image:
  <<: *publish_base
  before_script: *publish_before_script
  script:
    - |
      set -eu
      SEMVER="${CI_COMMIT_TAG#v}"
      exec /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/infra/Dockerfile.backend" \
        --build-arg "VERSION=${SEMVER}" \
        --destination "${CI_REGISTRY_IMAGE}/backend:${SEMVER}" \
        --destination "${CI_REGISTRY_IMAGE}/backend:latest"

frontend:image:
  <<: *publish_base
  before_script: *publish_before_script
  script:
    - |
      set -eu
      # Use ${VAR:-} so `set -u` doesn't abort before the friendly error fires.
      if [ -z "${STASH_OIDC_AUTHORITY:-}" ] || [ -z "${STASH_OIDC_CLIENT_ID:-}" ]; then
        echo "ERROR: STASH_OIDC_AUTHORITY and STASH_OIDC_CLIENT_ID must be set as masked CI/CD variables (Settings -> CI/CD -> Variables) before publishing the frontend image."
        exit 1
      fi
      SEMVER="${CI_COMMIT_TAG#v}"
      exec /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/infra/Dockerfile.frontend" \
        --destination "${CI_REGISTRY_IMAGE}/frontend:${SEMVER}" \
        --destination "${CI_REGISTRY_IMAGE}/frontend:latest" \
        --build-arg "NGINX_CONF=nginx.k8s.conf" \
        --build-arg "STASH_VERSION=${SEMVER}" \
        --build-arg "VITE_AUTH_MODE=oidc" \
        --build-arg "VITE_OIDC_AUTHORITY=${STASH_OIDC_AUTHORITY}" \
        --build-arg "VITE_OIDC_CLIENT_ID=${STASH_OIDC_CLIENT_ID}" \
        --build-arg "VITE_OIDC_SCOPE=${STASH_OIDC_SCOPE}" \
        --build-arg "VITE_PUBLIC_CLAIM_ENABLED=true"
