# Used by the root suite docker-compose (service name stash-backend).
# Re-resolve the backend through Docker DNS: a cached IP goes stale when the
# backend container is recreated and may then belong to another module.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream stash_backend {
    zone stash_backend 64k;
    server stash-backend:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://stash_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types {} default_type "application/manifest+json";
        try_files $uri =404;
    }

    location = /brand.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self)" always;
    }
}
