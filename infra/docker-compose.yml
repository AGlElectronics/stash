name: stash

services:
  postgres:
    image: postgres:16-alpine
    container_name: stash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: stash
      POSTGRES_DB: stash
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stash -d stash"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO is LOCAL / Docker Desktop development ONLY.
  # NEVER use MinIO in production — point S3_* at real S3-compatible object storage.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stash-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stash
      MINIO_ROOT_PASSWORD: stashstash
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: stash-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8080
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://stash:stash@postgres:5432/stash?sslmode=disable
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-stash-data-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-stash}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-stashstash}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      # dev = X-Dev-User header; oidc = verify Bearer JWT (set issuer + client id)
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_DEFAULT_USER: dev-admin
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      PUBLIC_LOSTFOUND_CLAIM_ENABLED: ${PUBLIC_LOSTFOUND_CLAIM_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
        VITE_PUBLIC_CLAIM_ENABLED: ${VITE_PUBLIC_CLAIM_ENABLED:-true}
    container_name: stash-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
  minio-data:
