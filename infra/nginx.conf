upstream stash_backend {
    server backend:8080;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow uploading files via presigned URLs (large bodies pass through us
    # only when proxying the JSON metadata, but it's cheap insurance).
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy. The SPA calls relative /api/... so the same origin
    # serves both static assets and the API; this avoids CORS in production.
    location /api/ {
        proxy_pass http://stash_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # service worker must always come fresh
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types {} default_type "application/manifest+json";
        try_files $uri =404;
    }

    # Installation settings of the web app (sign-in address and the like),
    # mounted at /etc/conservices. Never cached, so a change shows on reload.
    location = /config.json {
        alias /etc/conservices/config.json;
        add_header Cache-Control "no-store" always;
    }

    # hashed assets can be cached forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self)" always;
    }
}
